<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSL Integration | UI Preview</title>
<style>
:root{color-scheme:dark;--bg:#071020;--pane:#0d1b32;--card:#152744;--text:#eff6ff;--muted:#93a9ca;--accent:#52a5ff;--violet:#a980ff}*{box-sizing:border-box}body{background:radial-gradient(circle at 50% 15%,#182d55,#070f1d 68%);min-height:100vh;margin:0;display:grid;place-items:center;font:15px/1.35 system-ui,Segoe UI,sans-serif;color:var(--text);padding:20px}.shell{background:#0a1528;border:1px solid #35547f;border-radius:15px;box-shadow:0 26px 90px #000a;max-width:760px;width:100%;overflow:hidden}.header{background:#122440;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #457ed1}.brand{font-weight:900;font-size:26px;letter-spacing:1px}.brand b{color:var(--accent)}.sub{color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase}.body{padding:18px 20px}.tabs{background:#101f39;border-radius:8px;display:flex;padding:4px;gap:6px}.tab{flex:1;background:transparent;border:0;color:#adbfdf;padding:12px 8px;font-weight:750;cursor:pointer;border-radius:6px}.tab.selected{background:linear-gradient(125deg,#203a5d,#152a46);color:#fff;box-shadow:inset 0 -3px #51a8ff}.tab.plus.selected{box-shadow:inset 0 -3px var(--violet)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:21px 0 12px}.head strong{font-size:16px}.head input{background:#0d1d34;border:1px solid #294b73;color:#fff;border-radius:7px;padding:9px 12px;width:41%;outline:none}.head input:focus{border-color:#5ba8fa}.list{display:grid;gap:5px;min-height:310px}.item{display:flex;align-items:center;padding:11px 12px;gap:18px;background:#172843;border-radius:6px;border-left:4px solid var(--accent)}.item:nth-child(2n){background:#102039}.item.plus{border-color:var(--violet)}.num{color:#86d1ff;min-width:43px;font-size:16px;font-weight:900}.item.plus .num{color:#c8b2ff}.name{font-weight:800;flex:1}.creator{font-size:12px;color:#9aaccb;min-width:130px;text-align:right}.foot{border-top:1px solid #244160;background:#101e34;padding:12px 20px;display:flex;align-items:center;gap:8px}.foot .muted{margin-right:auto;font-size:12px;color:#9bb2d5}.foot button{background:#20385a;border:1px solid #32567f;color:#dbefff;padding:8px 13px;border-radius:5px;cursor:pointer}.foot button:hover{filter:brightness(1.2)}.hint{text-align:center;color:#98aec9;font-size:12px;margin-top:14px}.empty{color:#aebbd1;text-align:center;margin:auto}@media(max-width:580px){.creator{min-width:0;max-width:100px}.sub{display:none}.head{align-items:flex-start;flex-direction:column}.head input{width:100%}.list{min-height:350px}.name{font-size:13px}.item{gap:10px}}
</style></head>
<body><main><section class="shell"><header class="header"><div class="brand"><b>TSL</b> INTEGRATION</div><div class="sub">Community demon rankings • Geode</div></header><div class="body"><nav class="tabs"><button class="tab selected" data-list="0">THE SHITTY LIST</button><button class="tab plus" data-list="1">THE SHITTY LIST PLUS</button></nav><div class="head"><strong id="title">THE SHITTY LIST</strong><input id="search" type="search" placeholder="search levels..." aria-label="Search levels"></div><div class="list" id="list"></div></div><footer class="foot"><span class="muted" id="count"></span><button id="prev">←</button><button id="next">→</button><button id="refresh">RESET</button><button id="web">WEB ↗</button></footer></section><div class="hint">v0.2 UI CONCEPT • IN GD: OPEN CREATE → SEARCH → TSL • CLICK A ROW FOR NATIVE GD LEVEL RESULTS</div></main>
<script>
const names=[[
['Shitty Acheron (Twoft)','Twoft'],['Shitty Nhelv','jackyy'],['Shitty Discretion Advised','Keruo'],['Shitty SARYYX NEVER CLEAR','Twoft'],['Shitty Sky Shredder','phantom'],['Shitty Knights of Thunder','Berriez'],['Shitty Antarctic Lights','hexurii'],['Shitty The Devil','FnMs'],['Shitty The Art of the Blade','jackyy'],['Shitty Ashley Wave Trials','Rory']],
[['Shitty Flamewall','Deceit'],['Shitty Nullscapes','dofar'],['Shitty LIMBO','Asteria.'],['Shitty Kyouki','Deceit'],['Shitty Injury','gzarvati'],['Shitty Stellar Night','heizenn'],['Shitty Spectre','zEvolution64'],['Shitty NEUTRA','/Swan'],['Shitty Avernus','mrcsgmd'],['Shitty Tidal Wave','DuoFresh']]];
let active=0,page=0;const $=x=>document.getElementById(x);function render(){let q=$('search').value.toLowerCase();let data=names[active].map(([name,creator],i)=>({name,creator,rank:i+1})).filter(x=>(x.name+' '+x.creator+' '+x.rank).toLowerCase().includes(q));let pages=Math.max(1,Math.ceil(data.length/5));page=Math.max(0,Math.min(page,pages-1));$('list').replaceChildren();for(const x of data.slice(page*5,page*5+5)){let el=document.createElement('div');el.className='item'+(active?' plus':'');el.title='In Geometry Dash, opens native online level results for '+x.name;el.style.cursor='pointer';el.tabIndex=0;el.onclick=()=>alert('In-game this opens Geometry Dash online search for:\n'+x.name+'\n\nThis browser file is a UI mockup only.');let rank=document.createElement('span');rank.className='num';rank.textContent='#'+x.rank;let name=document.createElement('span');name.className='name';name.textContent=x.name;let creator=document.createElement('span');creator.className='creator';creator.textContent='by '+x.creator;el.append(rank,name,creator);$('list').append(el)}if(!data.length){let e=document.createElement('div');e.className='empty';e.textContent='no levels found';$('list').append(e)}$('count').textContent=`${page+1}/${pages} • ${data.length} sample levels`;}
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{active=Number(btn.dataset.list);page=0;$('search').value='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('selected',b===btn));$('title').textContent=active?'THE SHITTY LIST PLUS':'THE SHITTY LIST';render()});$('search').oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('refresh').onclick=()=>{$('search').value='';page=0;render()};$('web').onclick=()=>window.open('https://tsl.pages.dev/list/'+(active?'tslplus':'tsl'),'_blank','noopener');render();
</script></body></html>
